
name: Compiler EYE OF GOD APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Extraire le ZIP EYE OF GOD
        shell: bash
        run: |
          set -euo pipefail
          if [ -f eog41.zip ]; then
            mkdir -p /tmp/eog-source
            unzip -q eog41.zip -d /tmp/eog-source
            if [ -d /tmp/eog-source/eog41 ]; then
              cp -a /tmp/eog-source/eog41/. .
            else
              cp -a /tmp/eog-source/. .
            fi
          fi
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src/main

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler APK de test
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: EYE-OF-GOD-v0.4.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
