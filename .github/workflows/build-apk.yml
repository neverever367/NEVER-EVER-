
name: Compiler EYE OF GOD APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extraire le projet v0.3.0
        id: source
        run: |
          ZIP_FILE="./eog41.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP v0.3.0 introuvable"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Projet Android introuvable"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projet trouve : $PROJECT_DIR"

      - name: Compiler APK
        run: |
          gradle -p "${{ steps.source.outputs.project_dir }}" :app:assembleDebug --no-daemon --stacktrace

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: EYE-OF-GOD-v0.3.0-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
          
